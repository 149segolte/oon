name: Build release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Cache Cargo files
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.target }}-
            cargo-${{ runner.os }}-

      - name: Build release binaries and libraries
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail

          output="dist/oon-${{ matrix.name }}"
          release_dir="target/${{ matrix.target }}/release"

          mkdir -p "$output"

          case "${{ runner.os }}" in
            Linux)
              cp "$release_dir/oon" "$output/"
              cp "$release_dir/liboon.so" "$output/"
              cp "$release_dir/liboon.a" "$output/"
              ;;

            Windows)
              cp "$release_dir/oon.exe" "$output/"
              cp "$release_dir/oon.dll" "$output/"
              cp "$release_dir/oon.lib" "$output/"
              ;;

            macOS)
              cp "$release_dir/oon" "$output/"
              cp "$release_dir/liboon.dylib" "$output/"
              cp "$release_dir/liboon.a" "$output/"
              ;;
          esac

          cp README* LICENSE* LANGUAGE* include* "$output/" 2>/dev/null || true

      - name: Create package
        run: |
          package="oon-${{ matrix.name }}"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          path: dist/oon-${{ matrix.name }}.tar.gz
          if-no-files-found: error
          archive: false
